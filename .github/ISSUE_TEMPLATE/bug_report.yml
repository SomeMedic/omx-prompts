name: Bug report
description: Report an unclear, broken, or unsafe prompt instruction.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: prompt_file
    attributes:
      label: Prompt file
      placeholder: "omx-api-integration-prompt.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken, unclear, or unsafe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the prompt say or cause Codex/OMX to do?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any project details or output snippets that help explain the issue?
